{% extends "base.html" %}

{% block title %}Новое расписание - EduNotes{% endblock %}

{% block content %}
<section class="section-head">
    <div>
        <h1>Новое расписание</h1>
        <p>Создайте отдельную запись занятия. Она появится в расписании и сохранится как заметка.</p>
    </div>
</section>

<form class="panel note-form" method="post">
    <div class="form-row">
        <label>
            Дата и время занятия
            <input name="lesson_date" type="date" required>
        </label>
        <label>
            Время занятия
            <input name="lesson_time" type="time" value="09:00">
        </label>
        <label>
            Аудитория
            <input name="classroom" placeholder="305">
        </label>
    </div>

    <label>
        Название
        <input name="title" placeholder="Алгебра: квадратные уравнения" required>
    </label>

    <div class="form-row">
        <label>
            Пространство
            <select name="workspace_id" required>
                {% for workspace in workspaces %}
                    <option value="{{ workspace.id }}">{{ workspace.name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Папка
            <select name="folder_id">
                <option value="">Без папки</option>
                {% for folder in folders %}
                    <option value="{{ folder.id }}">{{ folder.name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Предмет
            <input name="subject" placeholder="Алгебра">
        </label>
    </div>

    <label>
        Теги
        <input name="tags" value="расписание" placeholder="расписание, алгебра">
    </label>

    <label>
        План занятия
        <textarea name="teacher_note" rows="8" placeholder="Что будет на уроке"></textarea>
    </label>

    <label>
        Домашнее задание
        <textarea name="homework" rows="5" placeholder="Что нужно сделать после занятия"></textarea>
    </label>

    <div class="actions">
        <button class="primary" type="submit">Создать</button>
        <a class="button" href="{{ url_for('schedule') }}">Отмена</a>
    </div>
</form>
{% endblock %}
